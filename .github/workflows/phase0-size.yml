name: Phase 0 Size Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "spikes/rust-size/**"
      - "tools/size-report/**"
      - ".github/workflows/phase0-size.yml"

permissions:
  contents: read

jobs:
  size-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - name: Test core
        run: cargo test -p seed-core

      - name: Build and report size
        run: bash tools/size-report/size.sh
