name: sqlite-storage-spike

on:
  pull_request:
    paths:
      - "core/seed-core/Cargo.toml"
      - "core/seed-core/src/sqlite_storage.rs"
      - "core/seed-core/src/bin/seed-sqlite-storage-smoke.rs"
      - "core/seed-core/src/storage.rs"
      - "tools/sqlite-size-report.sh"
      - ".github/workflows/sqlite-storage-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check bundled adapter
        run: cargo check --workspace --features sqlite-storage-bundled
      - name: Clippy bundled adapter
        run: cargo clippy --workspace --all-targets --features sqlite-storage-bundled -- -D warnings
      - name: Test bundled adapter
        run: cargo test --workspace --features sqlite-storage-bundled
      - name: SQLite storage smoke
        run: cargo run --quiet --features sqlite-storage-bundled --bin seed-sqlite-storage-smoke
      - name: SQLite size comparison
        run: sh tools/sqlite-size-report.sh
