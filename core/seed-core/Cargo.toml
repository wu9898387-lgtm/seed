[package]
name = "seed-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Minimal protocol kernel primitives for Seed"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "=0.4.3"
sha2 = { version = "=0.11.0", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }
