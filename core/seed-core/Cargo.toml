[package]
name = "seed-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Minimal protocol kernel primitives for Seed"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
sqlite-storage = ["dep:rusqlite"]
sqlite-storage-bundled = ["sqlite-storage", "rusqlite/bundled"]
plugin-wasmi = ["dep:wasmi"]

[[bin]]
name = "seed-sqlite-storage-smoke"
path = "src/bin/seed-sqlite-storage-smoke.rs"
required-features = ["sqlite-storage"]

[[bin]]
name = "seed-storage-compare"
path = "src/bin/seed-storage-compare.rs"
required-features = ["sqlite-storage"]

[[bin]]
name = "seed-storage-crash-worker"
path = "src/bin/seed-storage-crash-worker.rs"
required-features = ["sqlite-storage"]

[[bin]]
name = "seed-plugin-wasmi-smoke"
path = "src/bin/seed-plugin-wasmi-smoke.rs"
required-features = ["plugin-wasmi"]

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "=0.4.3"
rusqlite = { version = "=0.40.2", optional = true, default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }
wasmi = { version = "=2.0.0", optional = true, default-features = false, features = ["validate"] }
