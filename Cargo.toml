[workspace]
resolver = "2"
members = [
    "crates/seed-core",
    "spikes/rust-size",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wu9898387-lgtm/seed"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
