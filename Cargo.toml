[workspace]
members = [
    "core/seed-core",
    "spikes/phase0-core",
    "spikes/phase0-crypto",
    "spikes/phase0-event",
    "spikes/phase0-plugin-wasm",
    "spikes/phase0-storage-append",
    "spikes/phase0-storage-sqlite",
    "spikes/phase0-transport",
    "spikes/phase0-genesis",
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
